<header id="header">
  <picture>
    <source media="(min-width: 1200px)" srcset="{{ .Site.BaseURL }}{{ .Site.Params.banner }}">
    <source media="(max-width: 500px)" srcset="{{ .Site.BaseURL }}images/banner_mobile.png">
    <img src="{{ .Site.BaseURL }}{{ .Site.Params.banner }}" alt="金門縣水土保持服務團　線上諮詢預約">
  </picture>
</header>

<nav class="km-nav" aria-label="主要選單">
  <ul class="km-nav__list">
    {{ $cur := .RelPermalink }}
    {{ range .Site.Menus.main }}
      {{ $url := .URL | relLangURL }}
      {{ $active := or (eq $cur $url) (and (ne $url "/") (hasPrefix $cur $url)) }}
      <li>
        <a href="{{ $url }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
      </li>
    {{ end }}
  </ul>
</nav>
